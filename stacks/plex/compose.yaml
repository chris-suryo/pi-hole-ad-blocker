# Plex: the main media server, shared with friends and family (docs/08-mediabox-apps.md §4).
# Runs on the media PC; Jellyfin can run alongside it on the same media, read-only.
# 1. Get a claim token (valid 4 minutes): https://www.plex.tv/claim
# 2. PLEX_CLAIM=claim-xxxx ./stacks/up.sh plex
# 3. Open http://mediabox:32400/web
# Hardware transcoding and remote streaming for shared users come with the owner's Plex Pass.
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    network_mode: host # Plex's LAN discovery needs host networking
    devices:
      - /dev/dri:/dev/dri # Intel Quick Sync (the image grants itself access)
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - ${APPDATA:-/srv/appdata}/plex:/config
      - ${MEDIA_DIR:-/srv/storage/data/media}:/media:ro
