# Plex. Runs on the media PC, alongside or instead of Jellyfin (same media, read-only).
# 1. Get a claim token (valid 4 minutes): https://www.plex.tv/claim
# 2. PLEX_CLAIM=claim-xxxx ./stacks/up.sh plex
# 3. Open http://mediabox:32400/web
# Hardware transcoding and streaming outside the home need Plex Pass; see docs/08-mediabox-apps.md.
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    network_mode: host # Plex's LAN discovery needs host networking
    devices:
      - /dev/dri:/dev/dri # Intel Quick Sync (the image grants itself access)
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - ${APPDATA:-/srv/appdata}/plex:/config
      - ${MEDIA_DIR:-/srv/storage/media}:/media:ro
