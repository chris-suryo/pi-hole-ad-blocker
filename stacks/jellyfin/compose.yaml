# Jellyfin: free media server with free hardware transcoding. Runs on the media PC.
# Start: ./stacks/up.sh jellyfin    Open: http://mediabox:8096
# Then Dashboard > Playback > Transcoding: Intel QuickSync (QSV). See docs/08-mediabox-apps.md.
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      - "${RENDER_GID:?set RENDER_GID in stacks/.env (getent group render | cut -d: -f3)}"
    devices:
      - /dev/dri:/dev/dri # Intel Quick Sync
    ports:
      - "8096:8096"
      - "7359:7359/udp" # lets apps on the LAN discover the server
    volumes:
      - ${APPDATA:-/srv/appdata}/jellyfin:/config
      - ${MEDIA_DIR:-/srv/storage/data/media}:/media:ro
    environment:
      - TZ=${TZ:-Etc/UTC}
      # Keep the cache inside the one data folder up.sh creates.
      - JELLYFIN_CACHE_DIR=/config/cache
