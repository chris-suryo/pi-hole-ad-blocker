# Portainer agent: lets the Portainer dashboard on the Pi manage the media PC.
# Start on the media PC: ./stacks/up.sh portainer-agent
# Then in Portainer on the Pi: Environments > Add > Docker Standalone > Agent,
# address mediabox:9001. Do that right away: the agent pairs with the first
# Portainer that connects to it.
services:
  portainer-agent:
    image: portainer/agent:lts
    container_name: portainer-agent
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
