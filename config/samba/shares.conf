# File shares for Macs/PCs on the LAN (and over Tailscale).
# Appended to /etc/samba/smb.conf in docs/07-storage-media-photos.md, step 5.
# Replace YOURUSER with your Pi username.

# General shared folder: Finder > Go > Connect to Server > smb://homepi.local/shared
[shared]
   path = /srv/storage/shared
   valid users = YOURUSER
   read only = no
   vfs objects = catia fruit streams_xattr

# Time Machine target: System Settings > General > Time Machine > Add Backup Disk
[timemachine]
   path = /srv/storage/timemachine
   valid users = YOURUSER
   read only = no
   vfs objects = catia fruit streams_xattr
   fruit:time machine = yes
   # Cap it so backups can't fill the whole drive. Roughly 2x the Mac's used space.
   fruit:time machine max size = 1T
