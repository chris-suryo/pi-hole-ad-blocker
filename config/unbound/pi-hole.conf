# Unbound as a private recursive resolver for Pi-hole.
# Installed to /etc/unbound/unbound.conf.d/pi-hole.conf by scripts/03-install-unbound.sh.
# Based on https://docs.pi-hole.net/guides/dns/unbound/
server:
    verbosity: 0

    # Only Pi-hole talks to this, on the Pi itself.
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # Set to yes only if the network has working IPv6 end to end.
    do-ip6: no
    prefer-ip6: no

    # Trust glue only if it is within the server's authority.
    harden-glue: yes

    # Require DNSSEC data for trust-anchored zones; stripped signatures fail.
    harden-dnssec-stripped: yes

    # Off: 0x20-bit randomisation breaks some authoritative servers.
    use-caps-for-id: no

    # Avoids IP fragmentation (DNS Flag Day 2020).
    edns-buffer-size: 1232

    # Refresh popular entries before they expire.
    prefetch: yes

    # One thread is plenty for a household.
    num-threads: 1

    # Never let public names resolve to private addresses (DNS rebinding protection).
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10

    # These documentation/test ranges should never appear in public DNS either.
    private-address: 192.0.2.0/24
    private-address: 198.51.100.0/24
    private-address: 203.0.113.0/24
    private-address: 255.255.255.255/32
    private-address: 2001:db8::/32
