# Automatic ZFS snapshots (installed to /etc/sanoid/sanoid.conf by
# scripts/mediabox/03-create-pool.sh). Snapshots undo deletions and bad edits;
# they are NOT backups: they live on the same drives.
# Browse or restore: ls /srv/storage/photos/.zfs/snapshot/

[tank/photos]
  use_template = important
[tank/shared]
  use_template = important
[tank/backups]
  use_template = important
[tank/data]
  use_template = media
# tank/timemachine: none. Time Machine keeps its own version history.

[template_important]
  frequently = 0
  hourly = 24
  daily = 14
  monthly = 3
  yearly = 0
  autosnap = yes
  autoprune = yes

# tank/data also holds in-progress downloads, and a snapshot pins every deleted
# file's space until it expires. Three days is enough to undo a mistaken
# "delete files" in Sonarr/Radarr without hoarding download churn.
[template_media]
  frequently = 0
  hourly = 0
  daily = 3
  monthly = 0
  yearly = 0
  autosnap = yes
  autoprune = yes
