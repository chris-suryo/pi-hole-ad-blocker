# Drive health monitoring (installed to /etc/smartd.conf by scripts/mediabox/03-create-pool.sh).
# Every disk: watch all SMART attributes, run a short self-test every Sunday at 02:00
# and a long one on the 1st of each month at 03:00, warn at 45 C and alarm at 55 C.
# Alerts go to the system log for now (journalctl -u smartmontools); Phase 8 routes them to ntfy.
DEVICESCAN -a -o on -S on -n standby,q -s (S/../../7/02|L/../01/./03) -W 4,45,55 -m root -M exec /usr/share/smartmontools/smartd-runner
